name: layout

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  generation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install CI prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Install pinned tools
        run: |
          make tools supply-chain-tools
          GOBIN="$PWD/.tools/bin" go install github.com/go-kratos/kratos/cmd/kratos/v3@v3.0.0-20260626125723-668db92c2c00
      - name: Verify layout source
        run: make verify
      - name: Verify generated repositories
        run: |
          ./scripts/verify-layout \
            .tools/bin/kratos \
            .tools/bin/buf \
            .tools/bin/govulncheck \
            .tools/bin/cyclonedx-gomod \
            .tools/bin/gitleaks
